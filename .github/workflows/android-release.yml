name: Eta Build

on:
  push:
    branches:
      - main
      - feat/virtual-screen-automation-vivo
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Debug APK
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            -Peta.minifyDebug=true \
            :app:assembleDebug

      - name: 验证并整理 APK
        id: apk
        run: |
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
